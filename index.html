<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Mystery Wallpaper 🎀</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%80%3C/text%3E%3C/svg%3E">

<meta property="og:type" content="website">
<meta property="og:title" content="Your Mystery Wallpaper 🎀">
<meta property="og:description" content="Scratch off a silver patch and reveal your free surprise wallpaper!">
<meta property="og:image" content="https://raw.githubusercontent.com/booksee-creater/imgg/refs/heads/Main/3ab59971-1fde-43bd-952f-06a561c3021e.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Your Mystery Wallpaper 🎀">
<meta name="twitter:description" content="Scratch off a silver patch and reveal your free surprise wallpaper!">
<meta name="twitter:image" content="https://raw.githubusercontent.com/booksee-creater/imgg/refs/heads/Main/3ab59971-1fde-43bd-952f-06a561c3021e.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FFD6EC;
    --lilac:#E4D4FF;
    --blue:#C9E7FF;
    --accent:#FF3D9A;
    --accent2:#7B2FF7;
    --plum:#3A1250;
    --silver:#D7DBE2;
    --silver-light:#F1F3F6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; min-height:100%;
    font-family:'Quicksand',sans-serif;
    color:var(--plum);
    overflow-x:hidden;
  }
  body{
    background:linear-gradient(135deg,var(--pink) 0%,var(--lilac) 45%,var(--blue) 100%);
    min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 64px;
    position:relative;
  }

  /* floating sparkles */
  .sparkle{
    position:fixed; pointer-events:none; opacity:.8;
    animation:drift linear infinite;
    z-index:0;
  }
  @keyframes drift{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(-40px) rotate(180deg);}
  }
  @keyframes twinkle{
    0%,100%{opacity:.25;}
    50%{opacity:.9;}
  }

  h1{
    font-family:'Fredoka',sans-serif;
    font-weight:700;
    font-size:clamp(28px,5vw,44px);
    text-align:center;
    color:var(--accent2);
    text-shadow:2px 2px 0 #fff, 4px 4px 0 rgba(123,47,247,.15);
    margin:24px 0 6px;
    z-index:1;
  }
  .sub{
    font-weight:500;
    font-size:15px;
    color:#6B4A8A;
    text-align:center;
    margin-bottom:36px;
    z-index:1;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:520px;
    height:460px;
    z-index:1;
  }

  .patch{
    position:absolute;
    width:121px; height:121px;
    border-radius:50% 45% 50% 48%;
    box-shadow:0 8px 20px rgba(58,18,80,.18);
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    transition:opacity .5s ease, filter .5s ease, transform .4s ease;
    touch-action:none;
  }
  .patch canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    cursor:crosshair;
  }
  .patch .under{
    font-size:44px;
    filter:grayscale(1) opacity(.35);
  }
  .patch.locked{
    opacity:.35;
    filter:grayscale(.6);
    pointer-events:none;
    transform:scale(.94);
  }

  .patch:focus-visible{
    outline:3px solid var(--accent2);
    outline-offset:3px;
  }

  .patch.hint{
    animation:pulseGlow 1.7s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 8px 20px rgba(58,18,80,.18); }
    50%{ box-shadow:0 8px 26px rgba(255,61,154,.55), 0 0 0 7px rgba(255,61,154,.16); }
  }
  @media (prefers-reduced-motion: reduce){
    .patch.hint{ animation:none; }
  }
  .patch.locked::after{
    content:"claimed";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fredoka',sans-serif;
    font-size:13px; color:#fff;
    background:rgba(58,18,80,.55);
  }

  /* scattered positions, gentle rotation each */
  #p0{ top:0;      left:6%;   transform:rotate(-6deg); }
  #p1{ top:0;      right:6%;  transform:rotate(8deg);  }
  #p2{ top:170px;  left:50%;  margin-left:-60.5px; transform:rotate(-3deg); }
  #p3{ bottom:0;   left:10%;  transform:rotate(5deg);  }
  #p4{ bottom:0;   right:6%;  transform:rotate(-9deg); }

  .patch.locked#p0{ transform:rotate(-6deg) scale(.94); }
  .patch.locked#p1{ transform:rotate(8deg) scale(.94); }
  .patch.locked#p2{ transform:rotate(-3deg) scale(.94); }
  .patch.locked#p3{ transform:rotate(5deg) scale(.94); }
  .patch.locked#p4{ transform:rotate(-9deg) scale(.94); }

  @media (max-width:360px){
    .patch{ width:99px; height:99px; }
    #p2{ margin-left:-49.5px; top:150px; }
    .stage{ height:410px; }
  }

  /* gentle idle pulse/glow to invite the first tap */
  .patch:not(.locked){
    animation:pulseGlow 2.4s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{ box-shadow:0 8px 20px rgba(58,18,80,.18), 0 0 0 0 rgba(255,61,154,.35); }
    50%{ box-shadow:0 8px 20px rgba(58,18,80,.18), 0 0 20px 7px rgba(255,61,154,.32); }
  }
  @media (prefers-reduced-motion: reduce){
    .patch:not(.locked){ animation:none; }
  }
  .patch.scratching{
    animation:none;
    transition:box-shadow .15s ease;
  }

  .footer{
    margin-top:20px;
    text-align:center;
    font-size:14px;
    color:#6B4A8A;
    z-index:1;
    line-height:1.8;
  }
  .footer a{
    color:var(--accent2);
    font-weight:700;
    text-decoration:none;
  }
  .footer a:hover{ color:var(--accent); text-decoration:underline; }

  /* reveal overlay */
  .overlay{
    position:fixed; inset:0;
    background:rgba(58,18,80,.55);
    display:none; align-items:center; justify-content:center;
    z-index:10;
    padding:20px;
  }
  .overlay.show{ display:flex; }
  .card{
    background:#fff;
    border-radius:4px;
    padding:20px 20px 54px;
    max-width:340px; width:100%;
    text-align:center;
    box-shadow:0 24px 50px rgba(0,0,0,.3), 0 0 0 1px rgba(0,0,0,.03);
    position:relative;
    animation:pop .4s cubic-bezier(.2,1.4,.4,1);
    transform:rotate(-2deg);
  }
  .card::before{
    content:"";
    position:absolute; top:-14px; left:50%;
    width:74px; height:26px;
    margin-left:-37px;
    transform:rotate(-4deg);
    background:repeating-linear-gradient(45deg,
      rgba(255,61,154,.6), rgba(255,61,154,.6) 6px,
      rgba(255,255,255,.65) 6px, rgba(255,255,255,.65) 12px);
    box-shadow:0 2px 5px rgba(0,0,0,.18);
    border-radius:2px;
  }
  @keyframes pop{
    0%{transform:rotate(-2deg) scale(.7); opacity:0;}
    100%{transform:rotate(-2deg) scale(1); opacity:1;}
  }
  .card h2{
    font-family:'Fredoka',sans-serif;
    color:var(--accent);
    font-size:20px;
    margin:8px 0 14px;
  }
  .card img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    object-position:center top;
    border-radius:2px;
    display:block;
    margin-bottom:6px;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
  }
  .caption{
    font-family:'Fredoka',sans-serif;
    font-size:13px;
    color:#B8A8C8;
    margin:0 0 16px;
  }
  .dl-btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    font-family:'Quicksand',sans-serif;
    font-weight:700;
    text-decoration:none;
    padding:12px 26px;
    border-radius:999px;
    font-size:15px;
    transition:transform .15s ease, background .15s ease;
  }
  .dl-btn:hover{ background:var(--accent2); transform:translateY(-2px); }
  .explore-btn{
    display:block;
    margin-top:10px;
    background:var(--accent2);
  }
  .explore-btn:hover{ background:var(--accent); }
  .close-x{
    position:absolute; top:10px; right:14px;
    background:none; border:none; font-size:20px;
    color:#B8A8C8; cursor:pointer;
  }

  .trail-dot{
    position:fixed;
    pointer-events:none;
    z-index:5;
    font-size:14px;
    color:var(--accent2);
    animation:trailFade .55s ease-out forwards;
  }
  @keyframes trailFade{
    0%{ opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0deg); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(.3) translateY(-14px) rotate(40deg); }
  }

  /* starburst */
  .burst{
    position:absolute; inset:-40px;
    pointer-events:none;
  }
  .burst span{
    position:absolute; left:50%; top:50%;
    width:6px; height:22px;
    background:linear-gradient(var(--accent),var(--accent2));
    border-radius:3px;
    transform-origin:center 60px;
    animation:shoot .6s ease-out forwards;
  }
  @keyframes shoot{
    0%{opacity:1; transform-origin:center 60px; transform:translate(-50%,-50%) rotate(var(--r)) scale(0);}
    100%{opacity:0; transform:translate(-50%,-50%) rotate(var(--r)) scale(1.6);}
  }
</style>
</head>
<body>

<h1>Your Mystery Wallpaper Awaits ✨</h1>
<p class="sub">Scratch off a patch below to claim your free phone background!</p>

<div class="stage" id="stage">
  <div class="patch" id="p0" role="button" tabindex="0" aria-label="Scratch patch 1 of 5 to reveal your surprise wallpaper"><span class="under">💌</span><canvas></canvas></div>
  <div class="patch" id="p1" role="button" tabindex="0" aria-label="Scratch patch 2 of 5 to reveal your surprise wallpaper"><span class="under">⭐</span><canvas></canvas></div>
  <div class="patch" id="p2" role="button" tabindex="0" aria-label="Scratch patch 3 of 5 to reveal your surprise wallpaper"><span class="under">💖</span><canvas></canvas></div>
  <div class="patch" id="p3" role="button" tabindex="0" aria-label="Scratch patch 4 of 5 to reveal your surprise wallpaper"><span class="under">✨</span><canvas></canvas></div>
  <div class="patch" id="p4" role="button" tabindex="0" aria-label="Scratch patch 5 of 5 to reveal your surprise wallpaper"><span class="under">🎀</span><canvas></canvas></div>
</div>

<div id="srAnnounce" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);"></div>

<p class="footer">Check out <strong>@book_tangled</strong> for more whimsy!<br>
  <a href="https://www.instagram.com/book_tangled" target="_blank" rel="noopener">Instagram</a>
  &nbsp;·&nbsp;
  <a href="https://www.pinterest.com/book_tangled/" target="_blank" rel="noopener">Pinterest</a>
  &nbsp;·&nbsp;
  <a href="https://www.threads.com/@book_tangled" target="_blank" rel="noopener">Threads</a>
</p>

<div class="overlay" id="overlay">
  <div class="card">
    <button class="close-x" id="closeX" aria-label="Close">✕</button>
    <div class="burst" id="burst"></div>
    <h2>You found your wallpaper! 🎉</h2>
    <img id="revealImg" src="" alt="Your surprise wallpaper">
    <p class="caption" id="captionText">✦ your surprise ✦</p>
    <a class="dl-btn" id="dlBtn" href="" download>Download wallpaper</a>
    <a class="dl-btn explore-btn" href="https://www.pinterest.com/book_tangled/" target="_blank" rel="noopener">Explore Here</a>
  </div>
</div>

<script>
  const WALLPAPERS = [
    { url: "https://raw.githubusercontent.com/booksee-creater/wallpaper-images/refs/heads/main/flower%20wallpaper.png", name: "Whimsy Flowers" },
    { url: "https://raw.githubusercontent.com/booksee-creater/wallpaper-images/refs/heads/main/rose%20wallpaper.png", name: "Vintage Roses Wallpaper" },
    { url: "https://raw.githubusercontent.com/booksee-creater/wallpaper-images/refs/heads/main/star%20wallpaper.png", name: "Bright Stars" },
    { url: "https://raw.githubusercontent.com/booksee-creater/wallpaper-images/refs/heads/main/CLOUD%20wallpaper%20blue.png", name: "Dreamy Clouds" }
  ];

  const STORAGE_KEY = "mysteryWallpaperClaimed";
  const patches = Array.from(document.querySelectorAll(".patch"));
  const overlay = document.getElementById("overlay");
  const revealImg = document.getElementById("revealImg");
  const dlBtn = document.getElementById("dlBtn");
  const burst = document.getElementById("burst");
  const closeX = document.getElementById("closeX");

  // preload wallpapers so the reveal shows instantly
  WALLPAPERS.forEach(w => { const img = new Image(); img.src = w.url; });

  const TRAIL_CHARS = ["✦","✧","⋆","·"];
  let lastTrail = 0;
  function spawnTrail(x, y){
    const now = performance.now();
    if(now - lastTrail < 45) return; // throttle
    lastTrail = now;
    const el = document.createElement("span");
    el.className = "trail-dot";
    el.textContent = TRAIL_CHARS[Math.floor(Math.random()*TRAIL_CHARS.length)];
    el.style.left = x + "px";
    el.style.top = y + "px";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 600);
  }

  function lockAllPatches(){
    patches.forEach(p => {
      p.classList.add("locked");
      p.classList.remove("hint");
      p.setAttribute("aria-label", "This patch has already been claimed");
      p.setAttribute("tabindex", "-1");
    });
  }

  function showReveal(wallpaper){
    if (navigator.vibrate) {
      navigator.vibrate(60); // short buzz, Android only — iOS silently ignores this
    }

    revealImg.src = wallpaper.url;
    document.getElementById("captionText").textContent = wallpaper.name;
    const fileName = decodeURIComponent(wallpaper.url.split("/").pop().split("?")[0]) || "wallpaper.png";

    dlBtn.textContent = "Download wallpaper";
    dlBtn.href = "#";
    dlBtn.onclick = async (e) => {
      e.preventDefault();
      dlBtn.textContent = "Preparing...";
      try{
        const res = await fetch(wallpaper.url);
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 4000);
        dlBtn.textContent = "Download wallpaper";
      }catch(err){
        // fallback: open the image directly if fetching failed (e.g. CORS)
        window.open(wallpaper.url, "_blank");
        dlBtn.textContent = "Download wallpaper";
      }
    };

    buildBurst();
    overlay.classList.add("show");
    const sr = document.getElementById("srAnnounce");
    if (sr) sr.textContent = "Surprise revealed! Your wallpaper is ready to download.";
  }

  function buildBurst(){
    burst.innerHTML = "";
    const rays = 14;
    for(let i=0;i<rays;i++){
      const s = document.createElement("span");
      s.style.setProperty("--r", (360/rays*i)+"deg");
      s.style.animationDelay = (Math.random()*0.05)+"s";
      burst.appendChild(s);
    }
  }

  closeX.addEventListener("click", () => overlay.classList.remove("show"));

  // one-per-visitor lock: if this browser already claimed a wallpaper, skip scratching entirely
  let claimed = null;
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    claimed = raw ? JSON.parse(raw) : null;
  } catch(e) { claimed = null; }

  if (claimed) {
    lockAllPatches();
    showReveal(claimed);
  } else {
    // gentle idle pulse to invite the first interaction
    let hintTimer = setTimeout(() => {
      patches.forEach(p => { if(!p.classList.contains("locked")) p.classList.add("hint"); });
    }, 4000);
    function clearHint(){
      clearTimeout(hintTimer);
      patches.forEach(p => p.classList.remove("hint"));
    }

    // set up scratch canvases
    patches.forEach(patch => {
    const canvas = patch.querySelector("canvas");
    const ctx = canvas.getContext("2d");
    let w, h, drawing = false, clearedPixels = 0, totalPixels = 0, done = false;

    function size(){
      const rect = patch.getBoundingClientRect();
      w = canvas.width = rect.width;
      h = canvas.height = rect.height;
      totalPixels = w*h;
      paintSilver();
    }

    function paintSilver(){
      const grad = ctx.createLinearGradient(0,0,w,h);
      grad.addColorStop(0,"#F1F3F6");
      grad.addColorStop(.5,"#C9CED6");
      grad.addColorStop(1,"#E8EBEF");
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,w,h);
      ctx.fillStyle = "#8B93A0";
      ctx.font = "11px Quicksand, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("scratch me", w/2, h/2);
      ctx.globalCompositeOperation = "destination-out";
    }

    function scratchAt(x,y){
      if(done) return;
      ctx.beginPath();
      ctx.arc(x,y,9,0,Math.PI*2);
      ctx.fill();
      clearedPixels += Math.PI*9*9*0.35; // rough estimate, cheap
      const pct = Math.min(clearedPixels / totalPixels, 1);

      // glow intensifies as the patch gets closer to revealing, like it's charging with sparkle
      patch.classList.add("scratching");
      const blur = 24 + pct*60;
      const spread = 8 + pct*22;
      const alpha = 0.65 + pct*0.35;
      patch.style.boxShadow = `0 8px 20px rgba(58,18,80,.18), 0 0 ${blur}px ${spread}px rgba(255,61,154,${alpha})`;

      if(pct > 0.60){
        finishScratch();
      }
    }

    function finishScratch(){
      if(done) return;
      done = true;
      const chosen = WALLPAPERS[Math.floor(Math.random()*WALLPAPERS.length)];
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(chosen)); } catch(e) {}
      canvas.style.transition = "opacity .4s ease";
      canvas.style.opacity = "0";
      lockAllPatches();
      setTimeout(() => showReveal(chosen), 250);
    }

    function pos(e){
      const rect = canvas.getBoundingClientRect();
      const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
      return {x:cx, y:cy};
    }

    canvas.addEventListener("mousedown", e => { clearHint(); drawing = true; const p = pos(e); scratchAt(p.x,p.y); spawnTrail(e.clientX, e.clientY); });
    canvas.addEventListener("mousemove", e => { if(drawing){ const p = pos(e); scratchAt(p.x,p.y); spawnTrail(e.clientX, e.clientY); } });
    window.addEventListener("mouseup", () => drawing = false);

    canvas.addEventListener("touchstart", e => { clearHint(); drawing = true; const p = pos(e); scratchAt(p.x,p.y); const t=e.touches[0]; spawnTrail(t.clientX, t.clientY); e.preventDefault(); }, {passive:false});
    canvas.addEventListener("touchmove", e => { if(drawing){ const p = pos(e); scratchAt(p.x,p.y); const t=e.touches[0]; spawnTrail(t.clientX, t.clientY); } e.preventDefault(); }, {passive:false});
    window.addEventListener("touchend", () => drawing = false);

    window.addEventListener("resize", size);
    size();

    patch.addEventListener("keydown", e => {
      if ((e.key === "Enter" || e.key === " ") && !done) {
        e.preventDefault();
        clearHint();
        finishScratch();
      }
    });
    });
  }

  // ambient sparkles
  const emojis = ["✦","✧","⭐","💫"];
  for(let i=0;i<16;i++){
    const s = document.createElement("div");
    s.className = "sparkle";
    s.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100+"vw";
    s.style.top = Math.random()*100+"vh";
    s.style.fontSize = (10+Math.random()*14)+"px";
    s.style.color = Math.random() > .5 ? "#FF3D9A" : "#7B2FF7";
    s.style.animationDuration = (4+Math.random()*4)+"s";
    s.style.animationName = "twinkle";
    document.body.appendChild(s);
  }
</script>
</body>
</html>
